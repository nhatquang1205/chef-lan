name: Uptime

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

# No overlap, and never cancel a run that may be halfway through posting an alert.
concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      STATE_FILE: ${{ github.workspace }}/state/uptime-state.json
    steps:
      - uses: actions/checkout@v4
      # State = artifact of the latest earlier run that has one. None (first run, expired,
      # failed runs) means everything was up.
      - name: Load previous state
        run: |
          mkdir -p state
          for id in $(gh run list --workflow uptime.yml --status completed --limit 15 \
                        --json databaseId --jq '.[].databaseId'); do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            if gh run download "$id" -n uptime-state -D state 2>/dev/null; then
              echo "State from run $id"
              break
            fi
          done || true
          [ -f "$STATE_FILE" ] || echo "No previous state; treating everything as up"
      - name: Check sites
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: .github/scripts/uptime-check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uptime-state
          path: state/uptime-state.json
          retention-days: 2
          if-no-files-found: ignore

services:
  postgres:
    image: postgres:17-alpine
    container_name: cheflan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cheflan
      POSTGRES_USER: cheflan
      POSTGRES_PASSWORD: cheflan_dev_only
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - cheflan-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cheflan -d cheflan"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cheflan-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: dev@cheflan.local
      PGADMIN_DEFAULT_PASSWORD: cheflan_dev_only
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  cheflan-pgdata:

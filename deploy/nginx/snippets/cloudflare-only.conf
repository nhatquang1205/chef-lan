# Included at the top of every bonbocon.com server block (port 80 and 443): a request that did not come through
# Cloudflare gets no answer at all (444 closes the connection). $from_cloudflare comes from conf.d/cloudflare-only.conf.
# Copy to /etc/nginx/snippets/cloudflare-only.conf.
if ($from_cloudflare = 0) {
    return 444;
}

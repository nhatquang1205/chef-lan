# Marks requests whose TCP peer is a Cloudflare edge: $from_cloudflare is 1 for those, 0 for everything else.
# It reads $realip_remote_addr (the real TCP peer), not $remote_addr: cloudflare-realip.conf has already replaced
# $remote_addr with the visitor's address, so allow/deny or a geo on $remote_addr would see visitors and block them all.
# Used by snippets/cloudflare-only.conf, which every bonbocon.com server block includes. Hosts that are not behind
# Cloudflare (wish-list on DuckDNS) do not include it and are unaffected.
#
# Copy to /etc/nginx/conf.d/cloudflare-only.conf (http context). Keep the ranges identical to cloudflare-realip.conf.
# Ranges from https://www.cloudflare.com/ips-v4 and /ips-v6 (checked 2026-11-12).

geo $realip_remote_addr $from_cloudflare {
    default 0;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

# Add INSIDE the existing chef-lan-web `server { ... }` block (the one with the website's
# `location /`), not in wish-list's. nginx picks the longest matching prefix, so /api/ goes to
# the API and everything else still goes to the website. /health is deliberately NOT proxied.
location /api/ {
    proxy_pass http://127.0.0.1:5100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # OVERWRITE rather than append ($proxy_add_x_forwarded_for): a client-supplied header must
    # never reach the API, or anyone could pick their own IP and dodge the login rate limit.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 1m;   # the API only takes small JSON
}
